<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доходы и расходы</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src https://functions.yandexcloud.net https://functions.yandexcloud.kz https://*.apigw.yandexcloud.net https://*.apigw.yandexcloud.kz; form-action 'none'">
<style>
/* VOICE: calm, exact money tool — the number first, nothing decorative
   IDEA: a precision gauge — income is the full scale, spending is the pointer
   PICTURE: large balance readout over one long scale bar split by category
   COLOUR and TYPE: aluminium, black, orange pointer; Geist 500 / Geist
   LAYOUT: readout + scale on top, entry form, then breakdown and journal */
:root{color-scheme:light dark;
--bg:light-dark(#e9eaec,#141517);--card:light-dark(#f6f6f7,#1d1f22);--ink:light-dark(#111214,#ececee);
--mute:light-dark(#5d6168,#9a9ea6);--line:light-dark(#cfd1d5,#2e3136);--acc:#ff4f00;--pos:light-dark(#0f6b3e,#55c98a);--neg:light-dark(#b3260a,#ff7a4d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Geist,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:clamp(26px,4vw,36px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--mute);font-size:14px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
select,input,button{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px}
button{cursor:pointer;font-weight:500}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.gauge{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,32px)}
.readout{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:20px;align-items:end}
.lbl{font-size:14px;color:var(--mute)}
.big{font-size:clamp(40px,7vw,72px);font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.mid{font-size:clamp(22px,3vw,30px);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.scale{position:relative;height:34px;margin-top:28px;background:light-dark(#dfe1e4,#26292d);border-radius:8px;overflow:hidden;display:flex}
.scale i{display:block;height:100%;transition:width .4s}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
.note{margin-top:10px;font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.5vw,24px)}
h2{font-size:20px;margin:0 0 14px;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
form{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.go{background:var(--acc);border-color:var(--acc);color:#fff}
.bars{display:grid;gap:10px}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.bar .t b{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .tr{height:8px;background:light-dark(#dfe1e4,#26292d);border-radius:4px;margin-top:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.list{margin-top:20px}
.list ul{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%}
.what{overflow:hidden}.what div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what small{color:var(--mute);font-size:13px}
.amt{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.del{min-height:36px;min-width:36px;padding:0;border:0;background:none;color:var(--mute);font-size:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:none;gap:12px;align-items:center;font-size:15px}
.toast button{min-height:36px;background:var(--acc);color:#fff;border:0}
.sync{font-size:13px;color:var(--mute)}
[hidden]{display:none!important}
.acct{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:14px;font-size:14px;color:var(--mute)}
.acct button{min-height:40px;font-size:15px}
.ya{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mute);vertical-align:1px}
.st.ok::before{background:var(--pos)}.st.warn::before{background:var(--acc)}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}.readout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.readout>div:first-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.scale i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Доходы и расходы</h1>
      <div class="sub" id="period">—</div>
    </div>
    <div class="ctrl">
      <input type="month" id="month" aria-label="Месяц">
      <select id="cur" aria-label="Валюта">
        <option value="₽">₽ рубли</option><option value="₸">₸ тенге</option>
        <option value="$">$ доллары</option><option value="€">€ евро</option>
      </select>
    </div>
  </header>
  <div class="acct">
    <span class="st" id="st">Записи хранятся только на этом устройстве</span>
    <button type="button" class="ya" id="login" hidden>Войти с Яндекс ID</button>
    <button type="button" id="logout" hidden>Выйти</button>
  </div>

  <section class="gauge" aria-label="Итог месяца">
    <div class="readout">
      <div><div class="lbl">Остаток</div><div class="big" id="bal">0</div></div>
      <div><div class="lbl">Доход</div><div class="mid" id="inc" style="color:var(--pos)">0</div></div>
      <div><div class="lbl">Расходы</div><div class="mid" id="exp" style="color:var(--neg)">0</div></div>
    </div>
    <div class="scale" id="scale" role="img" aria-label="Доля потраченного от дохода"></div>
    <div class="ticks"><span>0</span><span id="tickmax">0</span></div>
    <div class="note" id="note"></div>
  </section>

  <div class="grid">
    <section class="card">
      <h2>Добавить запись</h2>
      <div class="tabs">
        <button type="button" id="tOut" aria-pressed="true">Расход</button>
        <button type="button" id="tIn" aria-pressed="false">Доход</button>
      </div>
      <form id="f">
        <label>Сумма<input id="amt" inputmode="decimal" placeholder="0" required autocomplete="off"></label>
        <div class="row2">
          <label>Категория<select id="cat"></select></label>
          <label>Дата<input type="date" id="date" required></label>
        </div>
        <label id="ownL" hidden>Что это было<input id="own" maxlength="40" placeholder="например, ремонт машины" autocomplete="off"></label>
        <label>Комментарий<input id="nt" placeholder="необязательно" autocomplete="off"></label>
        <button class="go" type="submit" id="add">Добавить расход</button>
      </form>
    </section>
    <section class="card">
      <h2>Куда уходят деньги</h2>
      <div class="bars" id="bars"></div>
    </section>
  </div>

  <section class="card list">
    <h2>Все записи за месяц</h2>
    <ul id="ul"></ul>
  </section>
</div>
<div class="toast" id="toast"><span>Запись удалена</span><button type="button" id="undo">Вернуть</button></div>

<script>
{
// ===== НАСТРОЙКИ: впишите сюда два значения из инструкции =====
const CONFIG={
  CLIENT_ID:"fa0f1e6da6b746df97d4db0943434b3f",   // ClientID приложения с oauth.yandex.ru
  API_URL:"https://functions.yandexcloud.net/d4ealgh7lbbgafv49em1"      // адрес облачной функции, например https://functions.yandexcloud.net/d4e...
};
// ===============================================================

const CATS={
  out:[["Еда и продукты","#ff4f00"],["Жильё и коммуналка","#2f6fd6"],["Транспорт","#8a5cf0"],["Кафе и рестораны","#e0a100"],["Здоровье","#d63a6f"],["Одежда","#1f9e9a"],["Развлечения","#6aa52a"],["Связь и подписки","#7a7f88"]],
  in:[["Зарплата","#0f8a50"],["Подработка","#3fae74"],["Подарки","#7ccf9f"]]
};
const EXTRA=["#c2410c","#0e7490","#a16207","#7c3aed","#be185d","#15803d","#4b5563"];
const color=(t,c)=>{const f=CATS[t].find(x=>x[0]===c);if(f)return f[1];let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))>>>0;return EXTRA[h%EXTRA.length]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const KEY="budget-v1",TKEY="budget-token",DKEY="budget-dirty";
const ONLINE=!!(CONFIG.CLIENT_ID&&CONFIG.API_URL);

// ---------- данные ----------
let S={cur:"₽",curU:0,items:[]};
try{const raw=ls.get(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
// старые записи (до синхронизации) получают время изменения и строковый id
S.items=S.items.map(i=>Object.assign({},i,{id:String(i.id),u:i.u||Number(i.id)||Date.now(),del:!!i.del}));
const live=()=>S.items.filter(i=>!i.del);

function merge(a,b){
  const m=new Map();
  for(const i of [...a.items,...b.items]){const o=m.get(i.id);if(!o||i.u>o.u||(i.u===o.u&&i.del&&!o.del))m.set(i.id,i)}
  const fromB=(b.curU||0)>(a.curU||0);
  return {cur:fromB?b.cur:a.cur,curU:Math.max(a.curU||0,b.curU||0),items:[...m.values()]};
}

let type="out",lastDel=null,toastT=null;
let token=ONLINE?ls.get(TKEY):null;
let dirty=ls.get(DKEY)==="1",busy=false,again=false,timer=null;

const fmt=n=>{const s=Math.abs(n).toLocaleString("ru-RU",{maximumFractionDigits:2});return (n<0?"−":"")+s+" "+S.cur};

function save(){
  ls.set(KEY,JSON.stringify(S));
  if(token){dirty=true;ls.set(DKEY,"1");clearTimeout(timer);timer=setTimeout(sync,700);status()}
}

// ---------- вход через Яндекс ID ----------
function login(){
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{sessionStorage.setItem("budget-state",st)}catch(e){}
  const back=location.origin+location.pathname;
  location.href="https://oauth.yandex.ru/authorize?response_type=token&client_id="+encodeURIComponent(CONFIG.CLIENT_ID)+"&redirect_uri="+encodeURIComponent(back)+"&state="+encodeURIComponent(st)+"&force_confirm=no";
}
function readLoginReturn(){
  if(!location.hash.includes("access_token"))return;
  const p=new URLSearchParams(location.hash.slice(1));
  let st=null;try{st=sessionStorage.getItem("budget-state");sessionStorage.removeItem("budget-state")}catch(e){}
  history.replaceState(null,"",location.pathname+location.search);
  if(p.get("access_token")&&st&&p.get("state")===st){token=p.get("access_token");ls.set(TKEY,token);dirty=true;ls.set(DKEY,"1")}
}
let confirmOut=false;
function logout(){
  if(dirty&&!confirmOut){confirmOut=true;$("logout").textContent="Не всё отправлено. Всё равно выйти?";setTimeout(()=>{confirmOut=false;$("logout").textContent="Выйти"},5000);return}
  token=null;ls.del(TKEY);ls.del(DKEY);ls.del(KEY);dirty=false;
  S={cur:"₽",curU:0,items:[]};$("logout").textContent="Выйти";confirmOut=false;render();status();
}

// ---------- синхронизация ----------
let net="idle";
function status(){
  const st=$("st");
  $("login").hidden=!ONLINE||!!token;$("logout").hidden=!token;
  if(!ONLINE){st.className="st";st.textContent="Записи хранятся только на этом устройстве";return}
  if(!token){st.className="st warn";st.textContent="Войдите, чтобы записи были на всех ваших устройствах";return}
  if(net==="auth"){st.className="st warn";st.textContent="Вход устарел — войдите снова";return}
  if(net==="off"){st.className="st warn";st.textContent="Нет связи — всё сохранено на устройстве, отправлю позже";return}
  if(busy||dirty){st.className="st";st.textContent="Сохраняю…";return}
  st.className="st ok";st.textContent="Синхронизировано";
}
async function sync(){
  if(!token)return;
  if(busy){again=true;return}
  busy=true;again=false;status();
  const sent=JSON.stringify({cur:S.cur,curU:S.curU,items:S.items});
  try{
    const r=await fetch(CONFIG.API_URL,{method:"PUT",headers:{"Authorization":"OAuth "+token,"Content-Type":"application/json"},body:sent});
    if(r.status===401){token=null;ls.del(TKEY);net="auth";busy=false;status();$("login").hidden=false;return}
    if(!r.ok)throw new Error(r.status);
    const srv=await r.json();
    S=merge(S,{cur:srv.cur,curU:srv.curU,items:srv.items.map(i=>Object.assign(i,{id:String(i.id)}))});
    ls.set(KEY,JSON.stringify(S));
    net="ok";
    if(!again){dirty=false;ls.del(DKEY)}
    render();
  }catch(e){net="off"}
  busy=false;status();
  if(again)sync();
}
addEventListener("online",()=>{if(token)sync()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&token)sync()});

// ---------- интерфейс ----------
function fillCats(sel){
  const base=CATS[type].map(c=>c[0]);
  const mine=[...new Set(live().filter(i=>i.t===type&&!base.includes(i.cat)).map(i=>i.cat))];
  $("cat").innerHTML=[...base,...mine].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")+`<option value="__own">Свой вариант…</option>`;
  if(sel)$("cat").value=sel;
  toggleOwn();
}
function toggleOwn(){const on=$("cat").value==="__own";$("ownL").hidden=!on;$("own").required=on}
function setType(t){
  type=t;$("tOut").setAttribute("aria-pressed",t==="out");$("tIn").setAttribute("aria-pressed",t==="in");
  $("add").textContent=t==="out"?"Добавить расход":"Добавить доход";fillCats();
}

function render(){
  const m=$("month").value;
  const its=live().filter(i=>i.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u);
  const inc=its.filter(i=>i.t==="in").reduce((s,i)=>s+i.amt,0);
  const exp=its.filter(i=>i.t==="out").reduce((s,i)=>s+i.amt,0);
  const bal=inc-exp;
  $("cur").value=S.cur;
  const [y,mm]=m.split("-");
  $("period").textContent=new Date(+y,+mm-1,1).toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  $("bal").textContent=fmt(bal);$("bal").style.color=bal<0?"var(--neg)":"var(--ink)";
  $("inc").textContent=fmt(inc);$("exp").textContent=fmt(exp);

  const byCat={};its.filter(i=>i.t==="out").forEach(i=>byCat[i.cat]=(byCat[i.cat]||0)+i.amt);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const base=Math.max(inc,exp)||1;
  $("scale").innerHTML=cats.map(([c,v])=>`<i style="width:${v/base*100}%;background:${color("out",c)}" title="${esc(c)}"></i>`).join("");
  $("tickmax").textContent=fmt(Math.max(inc,exp));
  const n=$("note");
  if(!inc&&!exp)n.textContent="Начните с дохода за месяц, затем добавляйте расходы.";
  else if(!inc)n.textContent="Доход за этот месяц ещё не внесён.";
  else{const p=Math.round(exp/inc*100);n.textContent=exp>inc?`Расходы превысили доход на ${fmt(exp-inc)} (${p}% от дохода).`:`Потрачено ${p}% дохода.`}

  $("bars").innerHTML=cats.length?cats.map(([c,v])=>`<div class="bar"><div class="t"><span>${esc(c)}</span><b>${esc(fmt(v))} · ${Math.round(v/exp*100)}%</b></div><div class="tr"><i style="width:${v/cats[0][1]*100}%;background:${color("out",c)}"></i></div></div>`).join(""):`<div class="empty">Расходов за этот месяц пока нет.</div>`;

  $("ul").innerHTML=its.length?its.map(i=>`<li><span class="dot" style="background:${color(i.t,i.cat)}"></span><div class="what"><div>${esc(i.cat)}${i.note?" — "+esc(i.note):""}</div><small>${esc(new Date(i.date+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"}))}</small></div><span class="amt" style="color:${i.t==="in"?"var(--pos)":"var(--ink)"}">${i.t==="in"?"+":"−"}${esc(fmt(i.amt))}</span><button class="del" data-id="${esc(i.id)}" aria-label="Удалить запись">×</button></li>`).join(""):`<li style="display:block"><div class="empty">Записей нет. Добавьте доход или расход выше.</div></li>`;
}

$("tOut").onclick=()=>setType("out");
$("tIn").onclick=()=>setType("in");
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const amt=parseFloat($("amt").value.replace(/\s/g,"").replace(",","."));
  if(!(amt>0)){$("amt").focus();$("amt").setCustomValidity("Введите сумму больше нуля");$("amt").reportValidity();return}
  let cat=$("cat").value;
  if(cat==="__own"){cat=$("own").value.trim().slice(0,40);if(!cat){$("own").focus();return}}
  const date=$("date").value||today();
  const now=Date.now();
  S.items.push({id:now.toString(36)+Math.random().toString(36).slice(2,6),t:type,amt:Math.round(amt*100)/100,cat,note:$("nt").value.trim().slice(0,80),date,u:now,del:false});
  $("amt").value="";$("nt").value="";$("own").value="";fillCats(cat);
  if(date.slice(0,7)!==$("month").value)$("month").value=date.slice(0,7);
  save();render();$("amt").focus();
});
$("cat").addEventListener("change",()=>{toggleOwn();if($("cat").value==="__own")$("own").focus()});
$("amt").addEventListener("input",()=>$("amt").setCustomValidity(""));
$("ul").addEventListener("click",e=>{
  const b=e.target.closest(".del");if(!b)return;
  const it=S.items.find(i=>i.id===b.dataset.id&&!i.del);if(!it)return;
  it.del=true;it.u=Date.now();lastDel=it;save();render();
  const t=$("toast");t.style.display="flex";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",6000);
});
$("undo").onclick=()=>{if(lastDel){lastDel.del=false;lastDel.u=Date.now();lastDel=null;save();render()}$("toast").style.display="none"};
$("month").onchange=render;
$("cur").onchange=()=>{S.cur=$("cur").value;S.curU=Date.now();save();render()};
$("login").onclick=login;
$("logout").onclick=logout;

if(ONLINE)readLoginReturn();
$("month").value=today().slice(0,7);$("date").value=today();
setType("out");render();status();
if(token)sync();
}
</script>
</body>
</html>
